name: Publicar Portfolio Antonia Costa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Verificar site
        shell: bash
        run: |
          test -f site/index.html
          test -f site/style.css
          test -f site/script.js

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4